# =============================================================================
# ResumeForge AI — local production-like stack.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# The web app is served on http://localhost:3000 and the API on
# http://localhost:5000.
# =============================================================================

name: resumeforge

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: resumeforge/server:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5000'
      # The database lives on the mounted volume below.
      DATABASE_URL: file:/data/resumeforge.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in your shell or .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-openai/gpt-4o-mini}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One reverse proxy (the compose network / your load balancer) sits in
      # front of the app, so the client IP comes from X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - api-data:/data
    ports:
      - '5000:5000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        # Baked into the browser bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    image: resumeforge/web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  api-data:
