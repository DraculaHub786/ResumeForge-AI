name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Lint, typecheck, unit tests, build
  # ---------------------------------------------------------------------------
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/web/.next
            apps/server/dist
            packages/*/dist
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # End-to-end suite (Playwright)
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the web app for the e2e server
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
          NEXT_PUBLIC_BASE_URL: http://localhost:3100
        run: pnpm exec next build

      - name: Run the end-to-end suite
        env:
          # The build above is reused instead of rebuilding inside the script.
          E2E_SKIP_BUILD: '1'
          CI: 'true'
        run: pnpm exec playwright test --config e2e/playwright.config.ts

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.artifacts
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Container images
  # ---------------------------------------------------------------------------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: false
          tags: resumeforge/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: resumeforge/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
