name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the release tag
        id: release
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Resolve repository name (lowercase)
        id: repo
        run: echo "name=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.server
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-server:latest
            ghcr.io/${{ steps.repo.outputs.name }}-server:${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}-web:latest
            ghcr.io/${{ steps.repo.outputs.name }}-web:${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise the release
        run: |
          {
            echo "## Container images published"
            echo ""
            echo "- \`ghcr.io/${{ steps.repo.outputs.name }}-server:${{ steps.release.outputs.tag }}\`"
            echo "- \`ghcr.io/${{ steps.repo.outputs.name }}-web:${{ steps.release.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
